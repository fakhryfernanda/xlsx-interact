[project]
name = "xlsx-interact"
version = "0.1.0"
description = "CLI for reading .xlsx files"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
xlsx = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
